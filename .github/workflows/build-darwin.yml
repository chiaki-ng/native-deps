name: build-darwin

# Builds the dependencies pinned under deps/<name>/darwin.toml (the explicit
# list lives in config/darwin.toml) and publishes everything to one rolling
# `sources` release:
#   - the verified upstream source archives
#   - per-dependency build archives: <name>-<version>-darwin-<arch>.tar.gz
#   - SHA256SUMS and build.json
# The release description lists each library with its compiled version and
# sha256 sums. The build matrix is derived from the platform config by
# scripts/plan.sh; nothing in this file names individual dependencies.

on:
  push:
    branches: [main]
    paths: ['deps/**', 'config/**', 'scripts/**', '.github/**', 'Makefile']
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated deps to build (empty = all)'
        type: string
        default: ''
      arch:
        description: 'Architecture'
        type: choice
        options: [all, arm64, x86_64]
        default: all
      publish:
        description: 'Upload tarballs + sources to the releases'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-darwin-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_IMAGE: macos-26

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      architectures: ${{ steps.plan.outputs.architectures }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          ARCH: ${{ inputs.arch }}
          RUNNER_IMAGE: ${{ env.RUNNER_IMAGE }}
        run: ./scripts/plan.sh

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-dep
        with:
          name: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          entryhash: ${{ matrix.entryhash }}
          needs_key: ${{ matrix.needs_key }}

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pool-*-${{ matrix.arch }}
          merge-multiple: true
          path: pool
      - name: Package
        run: ./scripts/package.sh "${{ matrix.arch }}" "$PWD/pool" "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist

  publish:
    needs: [plan, assemble]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || inputs.publish == true
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: distfiles
      - uses: actions/download-artifact@v4
        with:
          pattern: pool-*
          merge-multiple: true
          path: pool

      - name: Build metadata
        run: |
          rev='${{ needs.plan.outputs.revision }}'
          files=$(cd distfiles && for f in *.tar.*; do
            [ -f "$f" ] || continue
            printf '{"file":"%s","sha256":"%s"}\n' "$f" "$(shasum -a 256 "$f" | cut -d" " -f1)"
          done | jq -s .)
          jq -s --arg rev "$rev" --argjson files "$files" \
            '{revision: $rev, files: $files,
              architectures: (map(.arch) | unique),
              deps: (map(.deps) | add | unique_by(.name))}' \
            distfiles/build-*.json >distfiles/build.json

      - name: Publish source archives and per-dependency builds to the sources release
        run: ./scripts/publish-release.sh "$PWD/distfiles" "$PWD/srcs" "$PWD/pool"
