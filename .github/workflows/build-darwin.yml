name: build-darwin

# Builds the dependencies pinned under deps/<name>/darwin.toml (the explicit
# list lives in config/darwin.toml). Pushes to main build and package but do
# not publish. Publishing happens if and only if a GitHub release is
# published for a tag that lives on main — then everything goes to one
# rolling `sources` release:
#   - the verified upstream source archives
#   - one build.tar.gz with all compiled dependencies and an internal
#     SHA256SUMS for every library, plus build.tar.gz.sha256 and build.json
# The release description lists each library with its compiled version and
# sha256 sums. The build matrix is derived from the platform config by
# scripts/plan.sh; nothing in this file names individual dependencies.

on:
  push:
    branches: [main]
    paths: ['deps/**', 'config/**', 'scripts/**', '.github/**', 'Makefile']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated deps to build (empty = all)'
        type: string
        default: ''
      arch:
        description: 'Architecture'
        type: choice
        options: [all, arm64, x86_64]
        default: all

permissions:
  contents: read

concurrency:
  group: build-darwin-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_IMAGE: macos-26

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      architectures: ${{ steps.plan.outputs.architectures }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          ARCH: ${{ inputs.arch }}
          RUNNER_IMAGE: ${{ env.RUNNER_IMAGE }}
        run: ./scripts/plan.sh

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dep
        with:
          name: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          entryhash: ${{ matrix.entryhash }}
          needs_key: ${{ matrix.needs_key }}

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pool-*-${{ matrix.arch }}
          merge-multiple: true
          path: pool
      - name: Package
        run: ./scripts/package.sh "${{ matrix.arch }}" "$PWD/pool" "$PWD/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist

  publish:
    needs: [plan, assemble]
    # iff: a release was published (and it isn't this pipeline's own rolling
    # `sources` release) for a tag that lives on main — enforced below.
    if: >-
      github.event_name == 'release'
      && github.event.release.tag_name != 'sources'
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Release tag must live on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag ${{ github.event.release.tag_name }} is not on main; refusing to publish"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: distfiles
      - uses: actions/download-artifact@v8
        with:
          pattern: pool-*
          merge-multiple: true
          path: pool

      - name: Build metadata
        run: |
          rev='${{ needs.plan.outputs.revision }}'
          files=$(cd distfiles && for f in *.tar.*; do
            [ -f "$f" ] || continue
            printf '{"file":"%s","sha256":"%s"}\n' "$f" "$(shasum -a 256 "$f" | cut -d" " -f1)"
          done | jq -s .)
          jq -s --arg rev "$rev" --argjson files "$files" \
            '{revision: $rev, files: $files,
              architectures: (map(.arch) | unique),
              deps: (map(.deps) | add | unique_by(.name))}' \
            distfiles/build-*.json >distfiles/build.json

      - name: Publish source archives and per-dependency builds to the sources release
        run: ./scripts/publish-release.sh "$PWD/distfiles" "$PWD/srcs" "$PWD/pool"
