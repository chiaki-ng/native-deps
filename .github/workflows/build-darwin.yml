name: build-darwin

# Builds the dependencies pinned under deps/<name>/darwin.toml (the explicit
# list lives in config/darwin.toml). Pushes to main build and package but do
# not publish. Publishing happens if and only if a GitHub release is
# published for a tag that lives on main — that release receives:
#   - the verified upstream source archives (downloaded from the pinned
#     URLs; nothing is fetched from this repo's own releases)
#   - one build.tar.gz with all compiled dependencies and an internal
#     SHA256SUMS for every library, plus build.tar.gz.sha256 and build.json
# The release notes are regenerated with each library's compiled version
# and sha256 sums. The build matrix is derived from the platform config by
# scripts/plan.sh; nothing in this file names individual dependencies.

on:
  push:
    branches: [main]
    paths:
      - 'deps/*/darwin.toml'
      - 'config/darwin.toml'
      - 'scripts/toolchain-darwin.sh'
      - '.github/workflows/build-darwin.yml'
      - 'deps/*/patches/**'
      - 'scripts/build.sh'
      - 'scripts/common.sh'
      - 'scripts/recipes.sh'
      - 'scripts/plan.sh'
      - 'scripts/package.sh'
      - 'scripts/publish-release.sh'
      - 'scripts/toml2json.py'
      - '.github/actions/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated deps to build (empty = all)'
        type: string
        default: ''
      arch:
        description: 'Architecture'
        type: choice
        options: [all, arm64, x86_64]
        default: all
      target:
        description: 'Target'
        type: choice
        options: [all, macos, ios, ios-simulator]
        default: all

permissions:
  contents: read

concurrency:
  group: build-darwin-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_IMAGE: macos-26

jobs:
  plan:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'darwin-deps-')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      architectures: ${{ steps.plan.outputs.architectures }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          ARCH: ${{ inputs.arch }}
          ONLY_TARGET: ${{ inputs.target }}
          RUNNER_IMAGE: ${{ env.RUNNER_IMAGE }}
        run: ./scripts/plan.sh

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-dep
        with:
          name: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          slug: ${{ matrix.slug }}
          image: ${{ matrix.image }}
          entryhash: ${{ matrix.entryhash }}
          needs_key: ${{ matrix.needs_key }}

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pool-${{ matrix.arch }}*
          path: pools
      - name: Package
        run: |
          for artifact in pools/pool-*; do
            slug=${artifact#pools/pool-}
            slug=${slug%%--*}
            mkdir -p "out/$slug/pool"
            cp -R "$artifact"/. "out/$slug/pool/"
          done
          ./scripts/package.sh "${{ matrix.arch }}" "$PWD/out" "$PWD/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist

  publish:
    needs: [plan, assemble]
    # iff: a release was published for a tag that lives on main (enforced
    # below). The tag_name guard just keeps the legacy `sources` mirror
    # release from triggering a publish into itself.
    if: >-
      github.event_name == 'release'
      && startsWith(github.event.release.tag_name, 'darwin-deps-')
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Release tag must live on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag ${{ github.event.release.tag_name }} is not on main; refusing to publish"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: distfiles
      - name: Build metadata
        run: |
          rev='${{ needs.plan.outputs.revision }}'
          files=$(cd distfiles && for f in *.tar.*; do
            [ -f "$f" ] || continue
            printf '{"file":"%s","sha256":"%s"}\n' "$f" "$(shasum -a 256 "$f" | cut -d" " -f1)"
          done | jq -s .)
          jq -s --arg rev "$rev" --argjson files "$files" \
            '{revision: $rev, files: $files,
              architectures: (map(.arch) | unique),
              deps: (map(.deps) | add | unique_by(.name)),
              targets: (map(.targets) | add)}' \
            distfiles/build-*.json >distfiles/build.json

      - name: Publish sources, build tarball and checksums to the released tag
        run: ./scripts/publish-release.sh "$PWD/distfiles" "$PWD/srcs"
