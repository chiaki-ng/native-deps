name: build-darwin

# Builds every pinned dependency from source for each architecture in
# deps.toml and publishes:
#   - the verified source archives -> rolling `sources` release
#   - per-arch prefix tarballs     -> rolling `builds` release
# The build matrix is derived from deps.toml by scripts/plan.sh; nothing in
# this file names individual dependencies.

on:
  push:
    branches: [main]
    paths: ['deps.toml', 'scripts/**', '.github/**', 'Makefile']
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated deps to build (empty = all)'
        type: string
        default: ''
      arch:
        description: 'Architecture'
        type: choice
        options: [all, arm64, x86_64]
        default: all
      publish:
        description: 'Upload tarballs + sources to the releases'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-darwin-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_IMAGE: macos-26

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      architectures: ${{ steps.plan.outputs.architectures }}
      revision: ${{ steps.plan.outputs.revision }}
      universal: ${{ steps.plan.outputs.universal }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          ARCH: ${{ inputs.arch }}
          RUNNER_IMAGE: ${{ env.RUNNER_IMAGE }}
        run: ./scripts/plan.sh

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-dep
        with:
          name: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          entryhash: ${{ matrix.entryhash }}
          needs_key: ${{ matrix.needs_key }}

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pool-*-${{ matrix.arch }}
          merge-multiple: true
          path: pool
      - name: Package
        run: ./scripts/package.sh "${{ matrix.arch }}" "$PWD/pool" "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist

  publish:
    needs: [plan, assemble]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || inputs.publish == true
    runs-on: macos-26 # lipo for the universal slice; must be an arm64 image
    permissions:
      contents: write
    env:
      UNIVERSAL: ${{ needs.plan.outputs.universal }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: distfiles

      - name: Build universal slice
        if: env.UNIVERSAL == 'true'
        run: |
          mkdir -p stage/arm64 stage/x86_64 stage/universal
          arm=$(ls distfiles | grep -- '-darwin-arm64\.tar\.')
          x86=$(ls distfiles | grep -- '-darwin-x86_64\.tar\.')
          tar -xf "distfiles/$arm" -C stage/arm64
          tar -xf "distfiles/$x86" -C stage/x86_64
          ./scripts/make-universal.sh stage/arm64/prefix stage/x86_64/prefix stage/universal/prefix
          rev=$(jq -r '.revision' distfiles/build-arm64.json)
          tar -C stage/universal --zstd -cf "distfiles/native-deps-$rev-darwin-universal.tar.zst" prefix

      - name: Checksums and build metadata
        run: |
          rev='${{ needs.plan.outputs.revision }}'
          (
            cd distfiles
            : >SHA256SUMS
            for f in *.tar.zst; do
              printf '%s  %s\n' "$(shasum -a 256 "$f" | cut -d" " -f1)" "$f" >>SHA256SUMS
            done
          )
          files=$(cd distfiles && for f in *.tar.zst; do
            printf '{"file":"%s","sha256":"%s"}\n' "$f" "$(shasum -a 256 "$f" | cut -d" " -f1)"
          done | jq -s .)
          jq -s --arg rev "$rev" --argjson files "$files" \
            '{revision: $rev, files: $files,
              architectures: (map(.arch)),
              deps: (map(.deps) | add | unique_by(.name))}' \
            distfiles/build-*.json >distfiles/build.json

      - name: Publish prebuilt tarballs to the builds release
        run: |
          notes=$(mktemp)
          {
            echo "Prebuilt darwin dependencies, built from the deps.toml pins at revision \`${{ needs.plan.outputs.revision }}\`."
            echo
            echo "Toolchain: $(xcodebuild -version | head -1) · minimum macOS: $(jq -r '.config.darwin.deployment_target' <(python3 scripts/toml2json.py deps.toml))"
            echo
            echo "See build.json for per-dependency versions and SHA256SUMS to verify downloads."
          } >"$notes"
          gh release view builds >/dev/null 2>&1 \
            || gh release create builds --title "Prebuilt darwin dependencies" --notes-file "$notes"
          gh release upload builds distfiles/native-deps-*.tar.zst distfiles/SHA256SUMS distfiles/build.json --clobber

      - name: Rebuild the sources release from the pinned upstream URLs
        run: ./scripts/publish-sources.sh "$PWD/srcs"
