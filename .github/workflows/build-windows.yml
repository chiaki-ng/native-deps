name: build-windows

on:
  push:
    branches: [main]
    paths: ['deps/**', 'config/**', 'scripts/**', '.github/**', 'Makefile']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated deps to build (empty = all)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORM: windows

jobs:
  plan:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'windows-deps-')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      architectures: ${{ steps.plan.outputs.architectures }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: ./scripts/plan.sh

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.image }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings in the checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            jq
      - name: Install the toolchain packages
        run: pacman -S --needed --noconfirm $(./scripts/plan.sh --packages)

      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: out/${{ matrix.slug }}/pool/${{ matrix.name }}
          key: dep-${{ matrix.name }}-${{ matrix.slug }}-${{ matrix.image }}-${{ matrix.entryhash }}

      - id: depcache
        if: steps.cache.outputs.cache-hit != 'true' && matrix.needs_key != ''
        uses: actions/cache/restore@v6
        with:
          path: out/${{ matrix.slug }}/pool
          key: ${{ matrix.needs_key }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/build.sh '${{ matrix.arch }}' '${{ matrix.name }}'

      - name: Save cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out/${{ matrix.slug }}/pool/${{ matrix.name }}
          key: dep-${{ matrix.name }}-${{ matrix.slug }}-${{ matrix.image }}-${{ matrix.entryhash }}

      - uses: actions/upload-artifact@v7
        with:
          name: pool-${{ matrix.slug }}--${{ matrix.name }}
          path: out/${{ matrix.slug }}/pool
          if-no-files-found: error

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pool-${{ matrix.arch }}--*
          path: pools
      - name: Package
        run: |
          for artifact in pools/pool-*; do
            slug=${artifact#pools/pool-}
            slug=${slug%%--*}
            mkdir -p "out/$slug/pool"
            cp -R "$artifact"/. "out/$slug/pool/"
          done
          ./scripts/package.sh "${{ matrix.arch }}" "$PWD/out" "$PWD/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist

  publish:
    needs: [plan, assemble]
    if: >-
      github.event_name == 'release'
      && startsWith(github.event.release.tag_name, 'windows-deps-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Release tag must live on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag ${{ github.event.release.tag_name }} is not on main; refusing to publish"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: distfiles
      - name: Build metadata
        run: |
          rev='${{ needs.plan.outputs.revision }}'
          files=$(cd distfiles && for f in *.tar.*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            printf '{"file":"%s","sha256":"%s"}\n' "$f" "$(sha256sum "$f" | cut -d" " -f1)"
          done | jq -s .)
          jq -s --arg rev "$rev" --argjson files "$files" \
            '{platform: "windows", revision: $rev, files: $files,
              architectures: (map(.arch) | unique),
              deps: (map(.deps) | add),
              targets: (map({(.arch): .targets}) | add)}' \
            distfiles/build-*.json >distfiles/build.json

      - name: Publish sources, build tarballs and checksums to the released tag
        run: ./scripts/publish-release.sh "$PWD/distfiles" "$PWD/srcs"
