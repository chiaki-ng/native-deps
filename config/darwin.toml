# Per-platform build configuration.
#
# `deps` is the explicit list of libraries built and published for this
# platform; each entry must have a pin at deps/<name>/darwin.toml, and every
# pin on disk must be listed here (the plan step enforces both, so the list
# and the pins cannot drift apart). Order is informational — build order
# comes from each pin's depends_on.

deployment_target = "26.0"
architectures = ["arm64"]

deps = [
  "openssl",
  "abseil",
  "protobuf",
  "curl",
  "ffmpeg",
  "opus",
  "sdl3",
  "miniupnpc",
]
