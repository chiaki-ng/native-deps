architectures = ["x86_64", "aarch64"]
primary_target = "linux"

deps = [
  "openssl",
  "nghttp2",
  "abseil",
  "protobuf",
  "curl",
  "opus",
  "sdl3",
  "miniupnpc",
  "libdrm",
  "libva",
  "vulkan-headers",
  "vulkan-loader",
  "glslang",
  "nv-codec-headers",
  "ffmpeg",
  "libplacebo",
]

[toolchain]
image = "docker.io/library/gcc:16@sha256:27470de79376e1033091a1f2cbfa805a10d790dcbd980389a07c4d6dc3606240"
glibc = "2.41"
gcc = "16"
packages = [
  "make",
  "cmake",
  "pkg-config",
  "meson",
  "ninja-build",
  "nasm",
  "python3",
  "perl",
  "patch",
  "git",
  "ca-certificates",
  "curl",
  "jq",
  "rsync",
  "xz-utils",
  "bzip2",
  "zstd",
  "libx11-dev",
  "libx11-xcb-dev",
  "libxcb1-dev",
  "libxrandr-dev",
  "libwayland-dev",
  "libasound2-dev",
  "libpulse-dev",
  "libpipewire-0.3-dev",
  "libudev-dev",
  "libdbus-1-dev",
]

[toolchain.runners]
x86_64 = "ubuntu-24.04"
aarch64 = "ubuntu-24.04-arm"

[targets.linux]
