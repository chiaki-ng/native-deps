# Cross builds compile a native protoc first, then build only the libraries
# for the target arch. utf8_range is fetched by CMake FetchContent, so
# protobuf builds need network access.

version = "33.4"
url = "https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protobuf-{version}.tar.gz"
sha256 = "bc670a4e34992c175137ddda24e76562bb928f849d712a0e3c2fb2e19249bea1"
kind = "cmake"
depends_on = ["abseil"]

[cmake_options]
protobuf_BUILD_TESTS = "OFF"
protobuf_ABSL_PROVIDER = "package"
protobuf_BUILD_PROTOC_BINARIES = "ON"
