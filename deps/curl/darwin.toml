version = "8.22.0"
url = "https://curl.se/download/curl-{version}.tar.bz2"
sha256 = "5d956a6a22b3c279f50c421ee5d3c9e9d660cb6f115dcf881b579e952130549c"
kind = "configure"
depends_on = ["openssl"]

# @POOL@ expands to the per-arch pool directory holding the built deps.
configure_flags = [
  "--disable-shared",
  "--enable-static",
  "--with-openssl=@POOL@/openssl",
  "--enable-ipv6",
  "--without-nghttp2",
  "--without-ngtcp2",
  "--without-quiche",
  "--without-brotli",
  "--without-zstd",
  "--without-libidn2",
  "--without-libpsl",
  "--without-librtmp",
  "--without-libssh2",
  "--without-gssapi",
  "--disable-ldap",
  "--disable-ldaps",
  "--without-ca-bundle",
  "--without-ca-path",
  "--without-ca-fallback",
]
