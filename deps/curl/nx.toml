version = "8.21.0-libnx"
repo = "https://github.com/xlanor/curl.git"
ref = "libnx-vtls"
commit = "763da99230624df88d0a6c867599d4e8ee945413"
kind = "cmake"
depends_on = ["nghttp2"]

[cmake_options]
BUILD_SHARED_LIBS = "OFF"
BUILD_STATIC_LIBS = "ON"
BUILD_CURL_EXE = "OFF"
BUILD_LIBCURL_DOCS = "OFF"
BUILD_MISC_DOCS = "OFF"
CURL_ENABLE_SSL = "ON"
CURL_USE_LIBNX = "ON"
CURL_DEFAULT_SSL_BACKEND = "libnx"
CURL_USE_OPENSSL = "OFF"
CURL_USE_MBEDTLS = "OFF"
CURL_CA_BUNDLE = "none"
CURL_CA_PATH = "none"
CURL_USE_LIBPSL = "OFF"
CURL_USE_LIBSSH2 = "OFF"
CURL_USE_LIBSSH = "OFF"
CURL_USE_GSSAPI = "OFF"
USE_NGHTTP2 = "ON"
USE_NGTCP2 = "OFF"
USE_LIBIDN2 = "OFF"
CURL_BROTLI = "OFF"
CURL_ZSTD = "OFF"
CURL_ZLIB = "OFF"
CURL_DISABLE_LDAP = "ON"
CURL_DISABLE_LDAPS = "ON"
ENABLE_IPV6 = "OFF"
ENABLE_UNIX_SOCKETS = "OFF"
ENABLE_THREADED_RESOLVER = "OFF"
CURL_DISABLE_WEBSOCKETS = "OFF"
CURL_DISABLE_SOCKETPAIR = "ON"
